{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LUSSO Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="top-logo">
    <a href="{% url 'home' %}" class="logo">
        LUSSO®
    </a>
</div>

<div class="cart-container">

    <div class="cart-box">

        <h1 class="cart-title">
            YOUR CART
        </h1>

        {% for item in items %}

        <div class="cart-item">

            <div class="left">

                <img src="{{ item.product.image.url }}"
                     class="product-image">

            </div>

            <div class="middle">

                <h2>
                    {{ item.product.name }}
                </h2>

                <div class="cart-options">

                    <div class="option-box">

                        <label>Size</label>

                        <select>

                            <option {% if item.size == "S" %}selected{% endif %}>S</option>
                            <option {% if item.size == "M" %}selected{% endif %}>M</option>
                            <option {% if item.size == "L" %}selected{% endif %}>L</option>
                            <option {% if item.size == "XL" %}selected{% endif %}>XL</option>

                        </select>

                    </div>

                    <div class="option-box">

                        <label>Color</label>

                        <select>

                            <option {% if item.color == "Black" %}selected{% endif %}>Black</option>
                            <option {% if item.color == "White" %}selected{% endif %}>White</option>
                            <option {% if item.color == "Gray" %}selected{% endif %}>Gray</option>

                        </select>

                    </div>

                </div>

                <span class="price">
                    {{ item.product.price }} LE
                </span>

                <div class="quantity-box">

    <a href="{% url 'decrease_quantity' item.key %}" class="qty-btn">
        -
    </a>

    <span>{{ item.quantity }}</span>

    <a href="{% url 'increase_quantity' item.key %}" class="qty-btn">
        +
    </a>

</div>

            </div>

            <div class="right">

                {{ item.subtotal }} LE

            </div>

        </div>

        {% endfor %}

        <div class="total-box">

            <h2>
                TOTAL : {{ total }} LE
            </h2>

            <a href="{% url 'checkout' %}"
               class="checkout-btn">

                CHECKOUT

            </a>

        </div>

    </div>

</div>

</body>

<style>

.top-logo{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:25px;
    margin-bottom:50px;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:52px;
    font-weight:900;
    letter-spacing:12px;
    font-family:Arial, sans-serif;
    transition:0.3s;
    text-shadow:0 0 10px rgba(255,255,255,0.25);
}

.logo:hover{
    transform:scale(1.05);
    color:#f5f5f5;
    text-shadow:0 0 20px rgba(255,255,255,0.5);
}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#0b0b0b;
    color:white;
    min-height:100vh;
    padding:40px;
}

.cart-container{

    width:100%;
    display:flex;
    justify-content:center;
}

.cart-box{

    width:100%;
    max-width:1200px;
}

.cart-title{

    font-size:42px;
    margin-bottom:40px;
    letter-spacing:3px;
}

.cart-item{

    width:100%;
    background:#111;
    border:1px solid #222;
    border-radius:30px;
    padding:25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}

.left{

    width:140px;
}

.product-image{

    width:95px;
    height:95px;
    object-fit:cover;
    border-radius:18px;
}

.middle{

    flex:1;
    padding:0 30px;
}

.middle h2{

    font-size:24px;
    margin-bottom:10px;
}

.middle p{

    color:#aaa;
    margin-bottom:6px;
}

.price{

    display:block;
    margin-top:15px;
    font-size:20px;
    font-weight:600;
}

.right{

    font-size:28px;
    font-weight:700;
}

.quantity-box{

    display:flex;
    align-items:center;
    gap:15px;
    margin-top:20px;
}

.qty-btn{

    width:40px;
    height:40px;
    border-radius:12px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.total-box{
    margin-top:35px;
    background:linear-gradient(145deg,#111,#1a1a1a);
    border-radius:35px;
    padding:45px;
    text-align:center;
    border:1px solid #2a2a2a;
    box-shadow:0 0 30px rgba(0,0,0,.35);
}

.total-box h2{

    font-size:42px;
    margin-bottom:30px;
}

.checkout-btn{
    display:inline-block;
    width:100%;
    padding:20px;
    background:white;
    color:black;
    text-decoration:none;
    border-radius:20px;
    font-size:18px;
    font-weight:700;
    transition:.3s;
}

.checkout-btn:hover{
    transform:translateY(-3px);
    background:#d4af37;
}

@media(max-width:900px){

    .cart-item{
        width:100%;
        background:#111;
        border:1px solid #222;
        border-radius:24px;
        padding:18px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:18px;
        transition:.3s;
    }

    .middle{

        padding:20px 0;
    }

    .right{

        margin-top:20px;
    }

    .cart-options{
        display:flex;
        gap:15px;
        margin-top:15px;
        flex-wrap:wrap;
    }

    .option-box{
        display:flex;
        flex-direction:column;
        gap:8px;
    }

    .option-box label{
        font-size:14px;
        color:#aaa;
    }

    .option-box select{
        padding:10px 14px;
        border-radius:12px;
        border:none;
        background:#1a1a1a;
        color:white;
        min-width:120px;
    }
    }

</style>

</html>
