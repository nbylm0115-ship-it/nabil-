{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LUSSO Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="top-logo">
    <a href="{% url 'home' %}" class="logo">
        LUSSO®
    </a>
</div>

<div class="cart-container">

    <div class="cart-box">

        <h1 class="cart-title">
            YOUR CART
        </h1>

        {% for item in items %}

        <div class="cart-item">

            <div class="left">

                <img src="{{ item.product.image.url }}"
                     class="product-image">

            </div>

            <div class="middle">

                <h2>
                    {{ item.product.name }}
                </h2>

                <div class="cart-options">

                    <div class="option-box">

                        <label>Size</label>

                        <select>

                            <option {% if item.size == "S" %}selected{% endif %}>S</option>
                            <option {% if item.size == "M" %}selected{% endif %}>M</option>
                            <option {% if item.size == "L" %}selected{% endif %}>L</option>
                            <option {% if item.size == "XL" %}selected{% endif %}>XL</option>

                        </select>

                    </div>

                    <div class="option-box">

                        <label>Color</label>

                        <select>

                            <option {% if item.color == "Black" %}selected{% endif %}>Black</option>
                            <option {% if item.color == "White" %}selected{% endif %}>White</option>
                            <option {% if item.color == "Gray" %}selected{% endif %}>Gray</option>

                        </select>

                    </div>

                </div>

                <div class="price-row">

                <span class="price">
                    {{ item.product.price }} LE
                </span>

            </div>

                <div class="quantity-box">

    <a href="{% url 'decrease_quantity' item.key %}" class="qty-btn">
        -
    </a>

    <span>{{ item.quantity }}</span>

    <a href="{% url 'increase_quantity' item.key %}" class="qty-btn">
        +
    </a>

</div>

            </div>

        </div>

        {% endfor %}

        <div class="total-box">

            <h2>
                TOTAL : {{ total }} LE
            </h2>

            <a href="{% url 'checkout' %}"
               class="checkout-btn">

                CHECKOUT

            </a>

        </div>

    </div>

</div>

</body>

<style>

.top-logo{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:25px;
    margin-bottom:50px;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    font-family:Arial, sans-serif;
    transition:0.3s;
    text-shadow:0 0 10px rgba(255,255,255,0.25);
}

.logo:hover{
    transform:scale(1.05);
    color:#f5f5f5;
    text-shadow:0 0 20px rgba(255,255,255,0.5);
}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#0b0b0b;
    color:white;
    min-height:100vh;
    padding:40px;
}

.cart-container{

    width:100%;
    display:flex;
    justify-content:center;
}

.cart-box{

    width:100%;
    max-width:1200px;
}

.cart-title{

    font-size:42px;
    margin-bottom:40px;
    letter-spacing:3px;
}

.cart-item{
    width:100%;
    background:#0f0f0f;
    border:1px solid #1d1d1d;
    border-radius:28px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:20px;
}

.left{
    width:100px;
    flex-shrink:0;
}

.product-image{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:18px;
}
.middle{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.middle h2{
    font-size:22px;
    line-height:1.4;
    margin:0;
}
.middle p{

    color:#aaa;
    margin-bottom:6px;
}

.price{
    font-size:22px;
    font-weight:600;
}

.right{
    font-size:24px;
    font-weight:700;
    white-space:nowrap;
}

.quantity-box{

    display:flex;
    align-items:center;
    gap:15px;
    margin-top:20px;
}

.qty-btn{

    width:40px;
    height:40px;
    border-radius:12px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.total-box{
    margin-top:25px;
    background:#0f0f0f;
    border-radius:28px;
    padding:30px;
    text-align:center;
    border:1px solid #1f1f1f;
}

.total-box h2{
    font-size:28px;
    margin-bottom:20px;
}

.checkout-btn{
    display:inline-block;
    width:220px;
    padding:16px;
    background:white;
    color:black;
    text-decoration:none;
    border-radius:16px;
    font-size:17px;
    font-weight:700;
    transition:.3s;
    box-shadow:0 0 25px rgba(255,255,255,.08);
}

.checkout-btn:hover{
    transform:translateY(-3px);
    background:#d4af37;
}

@media(max-width:900px){

    .cart-item{
    flex-direction:row;
    align-items:flex-start;
    text-align:left;
}

.middle h2{
    font-size:18px;
}

.price{
    font-size:18px;
}

.right{
    font-size:20px;
}

    .cart-options{
        display:flex;
        gap:10px;
        margin-top:8px;
    }

    .option-box{
        display:flex;
        flex-direction:column;
        gap:8px;
    }

    .option-box label{
        font-size:13px;
        color:#888;
        margin-bottom:5px;
    }

    .option-box select{
        width:95px;
        padding:8px 10px;
        border-radius:12px;
        border:none;
        background:#171717;
        color:white;
        font-size:14px;
    }
    }

</style>

</html>
