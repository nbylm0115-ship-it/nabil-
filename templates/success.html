{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Success | LUSSO</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{

            background:#0b0b0b;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;
            position:relative;
        }

        /* BACKGROUND */

        .bg{

            position:absolute;
            inset:0;

            background:url("{% static 'images/bg.jpg' %}") center/cover;

            opacity:.15;
            transform:scale(1.1);

            filter:blur(2px);
        }

        .overlay{

            position:absolute;
            inset:0;

            background:linear-gradient(
                to bottom,
                rgba(0,0,0,.7),
                rgba(0,0,0,.9)
            );
        }

        /* CARD */

        .success-card{

            position:relative;
            z-index:10;

            width:100%;
            max-width:520px;

            background:rgba(17,17,17,.92);

            border:1px solid #2a2a2a;

            border-radius:35px;

            padding:60px 45px;

            text-align:center;

            backdrop-filter:blur(10px);

            animation:fadeUp .8s ease;
        }

        @keyframes fadeUp{

            from{

                opacity:0;
                transform:translateY(40px);
            }

            to{

                opacity:1;
                transform:translateY(0);
            }
        }

        /* CHECK ICON */

        .check-circle{

            width:110px;
            height:110px;

            border-radius:50%;

            margin:auto;

            background:#d4af37;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:55px;
            color:black;

            font-weight:bold;

            box-shadow:0 0 40px rgba(212,175,55,.35);

            margin-bottom:35px;
        }

        .brand{

            color:#d4af37;

            letter-spacing:5px;

            font-size:13px;

            margin-bottom:15px;
        }

        h1{

            color:white;

            font-size:52px;

            margin-bottom:18px;

            line-height:1.1;
        }

        .desc{

            color:#999;

            line-height:1.8;

            font-size:16px;

            margin-bottom:40px;
        }

        .order-box{

            background:#181818;

            border:1px solid #2a2a2a;

            border-radius:20px;

            padding:20px;

            margin-bottom:35px;
        }

        .order-box p{

            color:#888;

            margin-bottom:10px;

            font-size:14px;
        }

        .order-box h2{

            color:white;

            font-size:30px;
        }

        .btn{

            width:100%;

            display:inline-block;

            padding:20px;

            border-radius:18px;

            text-decoration:none;

            background:white;

            color:black;

            font-size:18px;

            font-weight:700;

            transition:.3s;
        }

        .btn:hover{

            transform:scale(1.03);

            background:#d4af37;
        }

        .small{

            margin-top:25px;

            color:#666;

            font-size:13px;
        }

        @media(max-width:600px){

            body{

                padding:20px;
            }

            .success-card{

                padding:45px 25px;
            }

            h1{

                font-size:38px;
            }
        }

    </style>

</head>

<body>

    <div class="bg"></div>

    <div class="overlay"></div>

    <div class="success-card">

        <div class="check-circle">
            ✓
        </div>

        <div class="brand">
            LUSSO® STREETWEAR
        </div>

        <h1>
            ORDER <br>
            CONFIRMED
        </h1>

        <div class="desc">

            Your order has been placed successfully.  
            Our team will contact you shortly to confirm your order.

        </div>

        <div class="order-box">

            <p>
                THANK YOU FOR SHOPPING WITH US
            </p>

            <h2>
                LUSSO
            </h2>

        </div>

        <a href="/"
           class="btn">

            CONTINUE SHOPPING

        </a>

        <div class="small">
            Premium Luxury Streetwear — Egypt
        </div>

    </div>

</body>

</html>
