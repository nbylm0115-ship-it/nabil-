{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>{{ product.name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    background:
    radial-gradient(circle at top,#1a1a1a 0%,#0a0a0a 45%,#050505 100%);
    color:white;
    overflow-x:hidden;
}
/* LOGO */
.top-logo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:85px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    background:linear-gradient(to bottom,
    rgba(0,0,0,.7),
    transparent);
    backdrop-filter:blur(10px);
}
.logo{
    text-decoration:none;
    color:white;
    font-size:34px;
    font-weight:800;
    letter-spacing:8px;
    transition:.3s;
}
.logo:hover{
    color:#d4af37;
}
/* CART */
.cart-icon{
    position:absolute;
    right:22px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#111;
    border:1px solid #2a2a2a;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
    font-size:22px;
    transition:.3s;
}
.cart-icon:hover{
    background:#d4af37;
    color:black;
}
.cart-count{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:22px;
    height:22px;
    border-radius:50%;
    background:#d4af37;
    color:black;
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
}
/* CONTAINER */
.container{
    width:90%;
    max-width:520px;
    margin:auto;
    padding-top:120px;
    padding-bottom:60px;
}
/* PRODUCT IMAGE */
.product-image{
    width:100%;
    background:white;
    border-radius:35px;
    padding:18px;
    margin-bottom:30px;
    overflow:hidden;
}
.product-image img{
    width:100%;
    height:430px;
    object-fit:cover;
    border-radius:24px;
}
/* PRODUCT INFO */
.product-info h1{
    font-size:52px;
    line-height:1.1;
    margin-bottom:22px;
    font-weight:800;
}
.price{
    font-size:42px;
    color:#d4af37;
    font-weight:700;
    margin:25px 0;
}
.desc{
    color:#8f8f8f;
    line-height:1.9;
    font-size:16px;
    margin-bottom:35px;
}
/* TITLES */
.section-title{
    font-size:12px;
    letter-spacing:5px;
    color:#666;
    margin-bottom:16px;
}
/* SIZE + COLOR */
.sizes,
.colors{
    display:flex;
    gap:14px;
    margin-bottom:35px;
}
/* SIZE BTN */
.size-btn{
    min-width:68px;
    height:68px;
    border-radius:20px;
    border:1px solid #2a2a2a;
    background:#121212;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}
.size-btn.active{
    background:white;
    color:black;
}
.size-btn:hover{
    border-color:#d4af37;
}
/* COLOR BTN */
.color-btn{
    width:54px;
    height:54px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    transition:.3s;
}
.color-btn.white{
    background:white;
    border:2px solid #888;
}
.color-btn.black{
    background:black;
}
.color-btn.gray{
    background:gray;
}
.color-btn.active{
    border:3px solid white;
    transform:scale(1.1);
}
/* BUTTON */
.add-btn{
    width:100%;
    height:68px;
    border:none;
    border-radius:22px;
    background:white;
    color:black;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}
.add-btn:hover{
    background:#d4af37;
    transform:translateY(-2px);
}
</style>
</head>
<body>
<!-- LOGO -->
<div class="top-logo">
    <a href="{% url 'home' %}"
       class="logo">
        LUSSO®️
    </a>
    <a href="{% url 'cart' %}"
       class="cart-icon">
        🛒
        <span class="cart-count">
            {{ request.session.cart|length }}
        </span>
    </a>
</div>
<!-- CONTAINER -->
<div class="container">
    <!-- IMAGE -->
    <div class="product-image">
        <img id="mainImage"
             src="{{ product.image.url }}"
             alt="{{ product.name }}">
    </div>
    <!-- INFO -->
    <div class="product-info">
        <h1>
            {{ product.name }}
        </h1>
        <!-- SIZE -->
        <div class="section-title">
            SELECT SIZE
        </div>
        <div class="sizes">
            <button type="button"
                    class="size-btn active"
                    onclick="selectSize(this,'M')">
                M
            </button>
            <button type="button"
                    class="size-btn"
                    onclick="selectSize(this,'L')">
                L
            </button>
            <button type="button"
                    class="size-btn"
                    onclick="selectSize(this,'XL')">
                XL
            </button>
        </div>
        <!-- COLORS -->
        <div class="section-title">
            SELECT COLOR
        </div>
        <div class="colors">
            <button type="button"
            class="color-btn white"
            onclick="selectColor(this,'White','{{ product.white_image.url }}')">
            </button>
            <button type="button"
            class="color-btn black active"
            onclick="selectColor(this,'Black','{{ product.black_image.url }}')">
            </button>
            <button type="button"
            class="color-btn gray"
            onclick="selectColor(this,'Gray','{{ product.grey_image.url }}')">
            </button>
        </div>
        <!-- FORM -->
        <form action="{% url 'add_to_cart' product.id %}"
              method="GET">
            <input type="hidden"
                   name="size"
                   id="selectedSize"
                   value="M">
            <input type="hidden"
                   name="color"
                   id="selectedColor"
                   value="Black">
            <!-- PRICE -->
            <div class="price">
                {{ product.price }} LE
            </div>
            <!-- DESCRIPTION -->
            <div class="desc">
                Premium oversized t-shirt with luxury fit.
                Made with soft cotton fabric for maximum comfort
                and clean streetwear look.
            </div>
            <!-- BUTTON -->
            <button type="submit"
                    class="add-btn">
                ADD TO CART
            </button>
        </form>
    </div>
</div>
<script>
function selectSize(element,size){
    document
    .querySelectorAll('.size-btn')
    .forEach(btn=>{
        btn.classList.remove('active');
    });
    element.classList.add('active');
    document
    .getElementById('selectedSize')
    .value=size;
}
function selectColor(element,color,image){
    document
    .querySelectorAll('.color-btn')
    .forEach(btn=>{
        btn.classList.remove('active');
    });
    element.classList.add('active');
    document
    .getElementById('selectedColor')
    .value=color;
    document
    .getElementById('mainImage')
    .src=image;
}
</script>
</body>
</html>
