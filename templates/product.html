{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

   <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    radial-gradient(circle at top,#1a1a1a 0%,#0a0a0a 45%,#050505 100%);
    color:white;
    overflow-x:hidden;
}

/* CONTAINER */

.container{
    width:90%;
    max-width:1400px;
    margin:auto;
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:140px;
    padding-bottom:60px;
}

/* PRODUCT PAGE */

.product-page{
    width:100%;
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:70px;
    align-items:center;
}

/* IMAGE */

.product-image{
    width:100%;
    background:#fff;
    border-radius:38px;
    padding:24px;
    overflow:hidden;
    position:relative;
    box-shadow:
    0 0 60px rgba(0,0,0,.45);
}

.product-image::before{
    content:'';
    position:absolute;
    inset:0;
    background:
    linear-gradient(to bottom,
    rgba(255,255,255,.04),
    transparent);
    pointer-events:none;
}

.product-image img{
    width:100%;
    height:520px;
    object-fit:cover;
    border-radius:28px;
    transition:.5s;
}

.product-image:hover img{
    transform:scale(1.03);
}

/* INFO */

.product-info{
    padding:10px;
}

/* LOGO */

.top-logo{
    position:relative;
    top:25;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    padding-top:48px;
    z-index:999;
}

.logo{
    text-decoration:none;
    color:white;
    font-size:42px;
    font-weight:800;
    letter-spacing:10px;
    transition:.3s;
}

.logo:hover{
    color:#d4af37;
    transform:translateY(-2px);
}

/* TITLE */

.product-info h1{
    font-size:68px;
    line-height:1;
    margin-bottom:18px;
    font-weight:800;
    letter-spacing:-2px;
}

/* PRICE */

.price{
    font-size:48px;
    color:#d4af37;
    font-weight:700;
    margin-bottom:28px;
}

/* DESCRIPTION */

.desc{
    color:#8f8f8f;
    line-height:1.9;
    font-size:15px;
    margin-bottom:45px;
    max-width:420px;
}

/* SECTION TITLE */

.section-title{
    font-size:12px;
    letter-spacing:5px;
    color:#666;
    margin-bottom:18px;
}

/* SIZE + COLORS */

.sizes,
.colors{
    display:flex;
    gap:14px;
    margin-bottom:38px;
    flex-wrap:wrap;
}

/* SIZE BUTTON */

.size-btn{
    min-width:72px;
    height:72px;
    padding:0 24px;
    border-radius:22px;
    border:1px solid #262626;
    background:#121212;
    color:white;
    cursor:pointer;
    font-size:18px;
    font-weight:600;
    transition:.3s;
}

.size-btn:hover{
    border-color:#d4af37;
    transform:translateY(-3px);
    box-shadow:0 0 25px rgba(255,255,255,.06);
}

.size-btn.active{
    background:white;
    color:black;
    border-color:white;
}

/* COLOR BUTTONS */

.color-btn{
    width:58px;
    height:58px;
    border-radius:50%;
    cursor:pointer;
    transition:.3s;
    border:none;
}

.color-btn.white{
    background:white;
    border:2px solid #999;
}

.color-btn.black{
    background:black;
}

.color-btn.gray{
    background:#9f9f9f;
}

.color-btn:hover{
    transform:scale(1.1);
}

.color-btn.active{
    border:3px solid white;
    transform:scale(1.13);
}

/* BUTTON */

.add-btn{
    width:100%;
    height:74px;
    border:none;
    border-radius:24px;
    background:white;
    color:black;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.35s;
    margin-top:15px;
}

.add-btn:hover{
    transform:translateY(-3px);
    background:#d4af37;
    box-shadow:0 0 30px rgba(212,175,55,.2);
}

/* MOBILE */

@media(max-width:1000px){

    .container{
        padding-top:130px;
        padding-bottom:50px;
    }

    .product-page{
        grid-template-columns:1fr;
        gap:40px;
    }

    .product-image{
        padding:18px;
        border-radius:30px;
    }

    .product-image img{
        height:380px;
        border-radius:22px;
    }

    .top-logo{
        padding-top:38px;
    }

    .logo{
        font-size:34px;
        letter-spacing:7px;
    }

    .product-info{
        padding:0;
    }

    .product-info h1{
        font-size:54px;
        line-height:1.05;
    }

    .price{
        font-size:38px;
    }

    .desc{
        font-size:15px;
        max-width:100%;
    }

    .size-btn{
        min-width:66px;
        height:66px;
        font-size:17px;
    }

    .color-btn{
        width:54px;
        height:54px;
    }

    .add-btn{
        height:68px;
        border-radius:20px;
        font-size:16px;
    }

}

</style>

</head>

<body>

    <div class="top-logo">

    <a href="{% url 'home' %}"
       class="logo">

       LUSSO®

    </a>

</div>

<div class="container">

    <div class="product-page">

        <!-- IMAGE -->

        <div class="product-image">

           <img id="mainImage"
src="{{ product.image.url }}"
alt="{{ product.name }}">
     
        </div>

        <!-- INFO -->

            <h1>

                {{ product.name }}

            </h1>

            <div class="price">

                {{ product.price }} LE

            </div>

            <div class="desc">

                Premium oversized t-shirt with luxury fit.
                Made with soft cotton fabric for maximum comfort
                and clean streetwear look.

            </div>

            <form action="{% url 'add_to_cart' product.id %}"
                  method="GET">

                <!-- SIZE -->

                <div class="section-title">

                    SELECT SIZE

                </div>

                <div class="sizes">

                    <button type="button"
                            class="size-btn active"
                            onclick="selectSize(this,'M')">

                        M

                    </button>

                    <button type="button"
                            class="size-btn"
                            onclick="selectSize(this,'L')">

                        L

                    </button>

                    <button type="button"
                            class="size-btn"
                            onclick="selectSize(this,'XL')">

                        XL

                    </button>

                </div>

                <input type="hidden"
                       name="size"
                       id="selectedSize"
                       value="M">

                <!-- COLORS -->

                <div class="section-title">

                    SELECT COLOR

                </div>

                <div class="colors">

                    <button type="button"
                    class="color-btn white"
                    onclick="selectColor(this,'White','{{ product.white_image.url }}')">
                    </button>

                    <button type="button"
                    class="color-btn black"
                    onclick="selectColor(this,'Black','{{ product.black_image.url }}')">
                    </button>

                    <button type="button"
                    class="color-btn gray"
                    onclick="selectColor(this,'Grey','{{ product.grey_image.url }}')">
                    </button>

                </div>

                <input type="hidden"
                       name="color"
                       id="selectedColor"
                       value="Black">

                <!-- BUTTON -->

                <div class="product-options">

                    <label>Choose Size</label>

                    <select>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                    </select>

                    <label>Choose Color</label>

                    <select>
                        <option>Black</option>
                        <option>White</option>
                        <option>Gray</option>
                    </select>

                </div>

                <button type="submit" class="add-btn">
                    ADD TO CART
                </button>

            </form>

        </div>

    </div>

</div>

<script>

function selectSize(element,size){

    document
    .querySelectorAll('.size-btn')
    .forEach(btn=>{

        btn.classList.remove('active');

    });

    element.classList.add('active');

    document
    .getElementById('selectedSize')
    .value=size;
}

function selectColor(element, color, image){

    document
    .querySelectorAll('.color-btn')
    .forEach(btn => {

        btn.classList.remove('active');

    });

    element.classList.add('active');

    document
    .getElementById('selectedColor')
    .value = color;

    document
    .getElementById('mainImage')
    .src = image;
}

</script>

</body>

</html>
