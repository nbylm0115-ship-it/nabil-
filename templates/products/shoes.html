{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOES| LUSSO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}
body{
background:#0d0d0d;
color:white;
}
.navbar{
position:sticky;
top:0;
z-index:999;
background:#111;
padding:20px 5%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}
.logo{
font-size:38px;
font-weight:900;
color:white;
text-decoration:none;
letter-spacing:4px;
}
.cart-btn{
position:relative;
color:rgb(246, 216, 21);
font-size:32px;
text-decoration:none;
display:flex;
align-items:center;
justify-content:center;
}
.cart-btn i{
font-size:30px;
color:white;
}
.cart-count{
position:absolute;
top:-8px;
right:-10px;
background:#d4af37;
color:black;
width:20px;
height:20px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}
.hero-banner{
height:350px;
background-image:url("{% static 'images/shoes-banner.jpeg' %}");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
margin:20px;
}
/* PRODUCTS */
.products{
padding:40px 5%;
}
.products-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}
.product-link{
text-decoration:none;
color:white;
display:block;
}
.product-link:hover,
.product-link:visited{
color:white;
}
.product-card{
background:#181818;
border-radius:20px;
overflow:hidden;
transition:.3s;
cursor:pointer;
}
.product-card:hover{
transform:translateY(-5px);
}
.product-card img{
width:100%;
height:220px;
object-fit:cover;
}
.product-info{
padding:15px;
}
.product-info h3{
font-size:15px;
margin-bottom:10px;
}
.price{
color:#d4af37;
font-size:18px;
font-weight:bold;
}
.footer{
text-align:center;
padding:40px;
border-top:1px solid #222;
margin-top:50px;
color:#888;
}
@media(max-width:768px){
.products-grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}
.product-card img{
height:170px;
}
.product-info{
padding:10px;
}
.product-info h3{
font-size:13px;
}
.price{
font-size:15px;
}
.logo{
font-size:28px;
}
.hero-banner{
height:220px;
margin:10px;
}
.cart-btn{
    position: relative;
    color: white;
    font-size: 24px;
    text-decoration: none;
    display:flex;
    align-items:center;
    justify-content:center;
}

.cart-btn i{
    color:white;
    font-size:24px;
}
}

</style>
</head>
<body>
<nav class="navbar">
<a href="{% url 'home' %}" class="logo">
LUSSO
</a>
<a href="{% url 'cart' %}" class="cart-btn">
<span class="cart-count">
    <i class="fa-solid fa-bag-shopping"></i>
{{ request.session.cart|length }}
</span>
</a>
</nav>
<div class="hero-banner">
    <div class="hero-content">
        <h1>SHOES</h1>
        <p>Premium Footwear Collection</p>
    </div>
</div>

{% for product in products %}

<a href="{% url 'product_detail' product.id %}" class="product-link">
<div class="product-card">
<img src="{{ product.image.url }}" alt="{{ product.name }}">
<div class="product-info">
<h3>{{ product.name }}</h3>
<div class="price">
{{ product.price }} EGP
</div>
</div>
</div>
</a>

{% endfor %}

</div>
</section>
<div class="footer">

©️ 2026 LUSSO

</div>
</body>
</html>
