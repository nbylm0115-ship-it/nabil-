<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LUSSO Launch</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
color:white;
}

.scene{
position:relative;
width:300px;
height:500px;
text-align:center;
}

.shirt{
position:absolute;
left:50%;
top:80px;
transform:translateX(-50%);
font-size:90px;
animation:shirtDrop 1.5s forwards;
z-index:2;
}

.box{
position:absolute;
left:50%;
top:240px;
transform:translateX(-50%);
font-size:110px;
z-index:1;
}

.rocket{
position:absolute;
left:50%;
top:240px;
transform:translateX(-50%);
font-size:120px;
opacity:0;
animation:rocketLaunch 2s forwards;
animation-delay:2s;
}

.message{
position:absolute;
bottom:0;
width:100%;
opacity:0;
animation:showText 1s forwards;
animation-delay:4s;
}

.message h1{
font-size:42px;
margin-bottom:10px;
}

.message p{
font-size:18px;
color:#d4d4d4;
}

@keyframes shirtDrop{
0%{
top:80px;
opacity:1;
}
100%{
top:250px;
opacity:0;
}
}

@keyframes rocketLaunch{
0%{
opacity:1;
transform:translateX(-50%) translateY(0);
}
100%{
opacity:1;
transform:translateX(-50%) translateY(-500px);
}
}

@keyframes showText{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="scene">

<div class="shirt">👕</div>

<div class="box">📦</div>

<div class="rocket">🚀</div>

<div class="message">
<h1>ORDER CONFIRMED</h1>
<p>Your order is on the way 🚀</p>
</div>

</div>

<script>

setTimeout(function(){
window.location.href="/";
},7000);

</script>

</body>
</html>
