<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LUSSO Launch</title>

<style>
body{
    margin:0;
    background:#0b0b0b;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
}

.container{
    text-align:center;
    color:white;
}

.shirt{
    font-size:120px;
    animation: fold 1.5s forwards;
}

.box{
    font-size:100px;
    opacity:0;
    animation: showBox 1s forwards;
    animation-delay:1.5s;
}

.rocket{
    font-size:100px;
    opacity:0;
    animation: launch 2s forwards;
    animation-delay:3s;
}

.text{
    margin-top:20px;
    font-size:28px;
    opacity:0;
    animation: showText 1s forwards;
    animation-delay:5s;
}

@keyframes fold{
    0%{transform:scale(1);}
    100%{transform:scale(.4);}
}

@keyframes showBox{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes launch{
    0%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:1;
        transform:translateY(-800px);
    }
}

@keyframes showText{
    from{opacity:0;}
    to{opacity:1;}
}
</style>
</head>

<body>

<div class="container">

    <div class="shirt">👕</div>

    <div class="box">📦</div>

    <div class="rocket">🚀</div>

    <div class="text">
        ORDER IS ON THE WAY
    </div>

</div>

<script>
setTimeout(function(){
    window.location.href="/success/";
},8000);
</script>

</body>
</html>
