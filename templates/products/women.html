{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WOMEN | LUSSO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0d0d0d;
color:white;
}

/* NAVBAR */

.navbar{
position:sticky;
top:0;
z-index:999;
background:#111;
padding:20px 5%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
font-size:38px;
font-weight:900;
color:white;
text-decoration:none;
letter-spacing:4px;
}

.cart-btn{
position:relative;
color:white;
font-size:24px;
text-decoration:none;
}

.cart-count{
position:absolute;
top:-8px;
right:-10px;
background:#d4af37;
color:black;
width:20px;
height:20px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

/* HERO */

.hero{
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("{% static 'images/women-banner.jpeg' %}");
background-size:cover;
background-position:center;
}

.hero h1{
font-size:60px;
font-weight:900;
}

.hero p{
margin-top:10px;
color:#ccc;
}

.hero-banner{
    height: 350px;
    background-image: url("{% static 'images/about2.jpeg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;
    margin:20px;
    position:relative;
}

.hero-content{
    background:rgba(0,0,0,.4);
    padding:20px 30px;
    border-radius:12px;
}

.hero-content h1{
    font-size: 58px;
    font-weight: 700;
    letter-spacing: 4px;
    line-height: 1;
}

.hero-content p{
    color:white;
    margin-top:8px;
}

/* PRODUCTS */

.products{
padding:60px 5%;
}

.products-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.product-card{
background:#181818;
border-radius:20px;
overflow:hidden;
transition:.3s;
}

.product-card:hover{
transform:translateY(-8px);
}

.product-card img{
width:100%;
height:350px;
object-fit:cover;
}

.product-info{
padding:20px;
}

.product-info h3{
margin-bottom:10px;
}

.price{
color:#d4af37;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.product-btn{
display:block;
text-align:center;
background:#d4af37;
color:black;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

/* FOOTER */

.footer{
text-align:center;
padding:40px;
border-top:1px solid #222;
margin-top:50px;
color:#888;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<a href="{% url 'home' %}" class="logo">
LUSSO
</a>

<a href="{% url 'cart' %}" class="cart-btn">

<i class="fa-solid fa-bag-shopping"></i>

<span class="cart-count">
{{ request.session.cart|length }}
</span>

</a>

</nav>

<!-- HERO -->

<div class="hero-banner">
    <div class="hero-content">
        <h1>WOMEN</h1>
        <p>Women's Collection</p>
    </div>
</div>

<!-- PRODUCTS -->

<section class="products">

<div class="products-grid">

{% for product in products %}

<div class="product-card">

<img src="{{ product.image.url }}">

<div class="product-info">

<h3>{{ product.name }}</h3>

<div class="price">
{{ product.price }} EGP
</div>

<a href="{% url 'product_detail' product.id %}" class="product-btn">
VIEW PRODUCT
</a>

</div>

</div>

{% endfor %}

</div>

</section>

<!-- FOOTER -->

<div class="footer">

© 2026 LUSSO

</div>

</body>
</html>
